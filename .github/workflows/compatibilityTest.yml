name: Run Compatibility Tests

on:
  schedule:
    - cron: "0 4 * * 5"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  CompatibilityTest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-chrome-for-testing-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-chrome-for-testing-

      - name: Install Chrome for Testing
        run: npx puppeteer browsers install chrome

      - name: Build extension
        run: npm run build:chromium

      # An extension can only be loaded into a headful browser, so the tests need a virtual display
      - name: Run compatibility tests
        if: github.event_name != 'schedule'
        run: xvfb-run --auto-servernum npm run test:compatibility
        env:
          CI: "true"

      - name: Run all tests
        if: github.event_name == 'schedule'
        run: xvfb-run --auto-servernum npm run test:all
        env:
          CI: "true"
